name: release

# 打 tag（v1.2.3）时自动构建并发布到 PyPI。
# 用 Trusted Publishing（OIDC）而不是 API token：仓库里不存任何密钥，
# PyPI 侧一次性配置本仓库为可信发布者即可。
# 这条流程同时验证了一个陌生人能从公开仓库装起来——发布前先在三平台上装一遍。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: 构建发行包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装构建依赖
        run: python -m pip install --upgrade build
      - name: 构建
        run: python -m build
      - name: 检查产物不含隐私或测试样本
        run: |
          python - <<'PY'
          import glob, tarfile, zipfile, sys
          bad = []
          for whl in glob.glob("dist/*.whl"):
              bad += [n for n in zipfile.ZipFile(whl).namelist()
                      if any(x in n for x in ("claude.json", "fixtures", ".env"))]
          for sdist in glob.glob("dist/*.tar.gz"):
              bad += [n for n in tarfile.open(sdist).getnames()
                      if any(x in n for x in ("claude.json", "fixtures", ".env"))]
          if bad:
              print("发行包里出现不该有的文件：", bad)
              sys.exit(1)
          print("产物检查通过")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test-install:
    name: 从产物安装并跑测试（${{ matrix.os }}）
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 装 wheel 而不是源码目录：这才是用户真正拿到的东西。
      # 不用 dist/*.whl —— PowerShell 不展开通配符，会把 * 当成字面量传给 pip。
      # 也不用 --no-index：那样依赖（mcp 等）也找不到，安装会失败。
      - name: 从 wheel 安装
        run: |
          python -m pip install --upgrade pip
          python -m pip install --find-links dist doclens-mcp
      - name: 确认命令可用且能完成 MCP 握手
        # 用脚本文件而不是 heredoc：Windows runner 是 PowerShell，
        # `python - <<'PY'` 那种 POSIX 写法会直接语法错误。
        run: python scripts/smoke_test.py

  publish:
    name: 发布到 PyPI
    needs: [build, test-install]
    runs-on: ubuntu-latest
    # 只有打 tag 才发布；手动触发只跑构建和测试，不会误发版本。
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/doclens-mcp
    permissions:
      id-token: write  # OIDC 必需
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-image:
    name: 发布容器镜像到 GHCR
    needs: build
    runs-on: ubuntu-latest
    # 镜像与 PyPI 是两条独立的发布路径：官方 MCP Registry 接受 OCI 镜像，
    # 所以在 PyPI 尚未开通时，这条能让 DocLens 被 Registry 和目录站收录。
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/doclens
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # 构建完立刻验证：镜像能启动并列出工具，否则推上去也是坏的。
      - name: 验证镜像能响应 MCP 握手
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/doclens:${{ steps.meta.outputs.version }}"
          docker run --rm -i "${IMAGE}" --help >/dev/null 2>&1 || true
          docker run --rm -i "${IMAGE}" <<'EOF' | head -5
          {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2026-07-28","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}
          EOF
