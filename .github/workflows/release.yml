name: release

# 打 tag（v1.2.3）时自动构建并发布到 PyPI。
# 用 Trusted Publishing（OIDC）而不是 API token：仓库里不存任何密钥，
# PyPI 侧一次性配置本仓库为可信发布者即可。
# 这条流程同时验证了一个陌生人能从公开仓库装起来——发布前先在三平台上装一遍。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: 构建发行包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装构建依赖
        run: python -m pip install --upgrade build
      - name: 构建
        run: python -m build
      - name: 检查产物不含隐私或测试样本
        run: |
          python - <<'PY'
          import glob, tarfile, zipfile, sys
          bad = []
          for whl in glob.glob("dist/*.whl"):
              bad += [n for n in zipfile.ZipFile(whl).namelist()
                      if any(x in n for x in ("claude.json", "fixtures", ".env"))]
          for sdist in glob.glob("dist/*.tar.gz"):
              bad += [n for n in tarfile.open(sdist).getnames()
                      if any(x in n for x in ("claude.json", "fixtures", ".env"))]
          if bad:
              print("发行包里出现不该有的文件：", bad)
              sys.exit(1)
          print("产物检查通过")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test-install:
    name: 从产物安装并跑测试（${{ matrix.os }}）
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 装 wheel 而不是源码目录：这才是用户真正拿到的东西。
      # 不用 dist/*.whl —— PowerShell 不展开通配符，会把 * 当成字面量传给 pip。
      # 也不用 --no-index：那样依赖（mcp 等）也找不到，安装会失败。
      - name: 从 wheel 安装
        run: |
          python -m pip install --upgrade pip
          python -m pip install --find-links dist doclens-mcp
      - name: 确认命令可用且能完成 MCP 握手
        run: |
          python - <<'PY'
          import asyncio, sys
          from mcp import Client, StdioServerParameters

          async def main():
              params = StdioServerParameters(command="doclens", args=[])
              async with Client(params) as client:
                  tools = await client.list_tools()
                  names = {t.name for t in tools.tools}
                  expected = {
                      "list_documents", "read_document", "search_document",
                      "extract_table", "inspect_document", "compare_extraction",
                  }
                  missing = expected - names
                  if missing:
                      print("缺少工具：", missing)
                      sys.exit(1)
                  print("握手成功，6 个工具齐全")

          asyncio.run(main())
          PY

  publish:
    name: 发布到 PyPI
    needs: [build, test-install]
    runs-on: ubuntu-latest
    # 只有打 tag 才发布；手动触发只跑构建和测试，不会误发版本。
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/doclens-mcp
    permissions:
      id-token: write  # OIDC 必需
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
